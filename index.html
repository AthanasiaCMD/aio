<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Video Downloader - Neo Brutalism</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-cloud-arrow-down"></i> ALL-IN-ONE DL</h1>
            <p>Download video TikTok, YouTube, Twitter, & RedNote dalam satu tempat!</p>
        </header>

        <div class="card">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Tempel link TikTok, YouTube, Twitter, atau RedNote..." autocomplete="off">
                <button id="downloadBtn" onclick="handleDownload()">
                    <i class="fa-solid fa-bolt"></i> GET
                </button>
            </div>
            <div id="statusMessage" class="status-message"></div>
        </div>

        <div id="resultContainer" class="result-container hidden">
            <div class="video-info">
                <img id="videoThumb" src="" alt="Thumbnail">
                <div class="details">
                    <h3 id="videoTitle">Judul Video</h3>
                    <p id="videoAuthor">Platform / Sumber</p>
                </div>
            </div>
            <div class="download-actions" id="actionButtons">
                <!-- Tombol download akan di-generate otomatis via JS berdasarkan platform -->
            </div>
        </div>

        <footer class="credit-footer">
            <p>Created by <a href="https://t.me/athanasiarisolmayo" target="_blank">Athanasia</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
